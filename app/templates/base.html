<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %} · {{ app_name }}</title>
  <meta name="description" content="{% block description %}Control de inventario farmacéutico hospitalario: stock, caducidades, reportes y alertas.{% endblock %}">
  <meta name="theme-color" content="#0b1220">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</body>
</html>
